[package]
name = "safebox-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Rust SDK for encrypting files into SafeBox SBOX 3.1 bundles"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
hex = "0.4.3"
hkdf = "0.12.4"
md-5 = "0.10.6"
rand = "0.8.5"
rsa = "0.9.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tempfile = "3.21.0"
thiserror = "2.0.16"
unicode-normalization = "0.1.24"
zeroize = "1.8.1"

[dev-dependencies]
rand_chacha = "0.3.1"
