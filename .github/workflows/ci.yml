name: SafeBox CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safebox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_REVISION: 4cf24164269a5ebf0c16a028a00727d0e77bbb05
  FLUTTER_TAG: 3.47.0

jobs:
  vulnerability-scan:
    name: Dart dependency vulnerability scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
    with:
      scan-args: |-
        --lockfile=pubspec.lock
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  windows:
    name: Windows / tests and release build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Flutter
        shell: pwsh
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          git init $flutterRoot
          git -C $flutterRoot remote add origin https://github.com/flutter/flutter.git
          git -C $flutterRoot fetch --depth 1 origin $env:FLUTTER_REVISION "refs/tags/$($env:FLUTTER_TAG):refs/tags/$($env:FLUTTER_TAG)"
          git -C $flutterRoot checkout --detach $env:FLUTTER_REVISION
          (Join-Path $flutterRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Resolve dependencies
        run: |
          flutter config --no-analytics
          flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          dart test test/sbox
          flutter test test/app --no-pub
      - name: Build Windows release
        run: flutter build windows --release --no-pub
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'safebox-windows-x64.zip' -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safebox-windows-x64
          path: safebox-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux / protocol tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - name: Install pinned Flutter
        shell: bash
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth 1 origin "$FLUTTER_REVISION" "refs/tags/$FLUTTER_TAG:refs/tags/$FLUTTER_TAG"
          git -C "$flutter_root" checkout --detach "$FLUTTER_REVISION"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
      - name: Analyze and test
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter analyze --no-pub
          dart test test/sbox
      - name: Build Linux release
        run: flutter build linux --release --no-pub
      - name: Package Linux release
        run: tar -C build/linux/x64/release/bundle -czf safebox-linux-x64.tar.gz .
      - name: Upload Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safebox-linux-x64
          path: safebox-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  apple:
    name: macOS and iOS / protocol tests and release builds
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Flutter
        shell: bash
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth 1 origin "$FLUTTER_REVISION" "refs/tags/$FLUTTER_TAG:refs/tags/$FLUTTER_TAG"
          git -C "$flutter_root" checkout --detach "$FLUTTER_REVISION"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
      - name: Analyze and test
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter analyze --no-pub
          dart test test/sbox
      - name: Build macOS release
        run: flutter build macos --release --no-pub
      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package macOS release
        shell: bash
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "safebox-macos-${RUNNER_ARCH}.zip"
      - name: Package unsigned iOS app
        shell: bash
        run: |
          app_path="$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" safebox-ios-unsigned.app.zip
      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safebox-macos-${{ runner.arch }}
          path: safebox-macos-${{ runner.arch }}.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned iOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safebox-ios-unsigned
          path: safebox-ios-unsigned.app.zip
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android / protocol tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install pinned Flutter
        shell: bash
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth 1 origin "$FLUTTER_REVISION" "refs/tags/$FLUTTER_TAG:refs/tags/$FLUTTER_TAG"
          git -C "$flutter_root" checkout --detach "$FLUTTER_REVISION"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
      - name: Analyze and test
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter analyze --no-pub
          dart test test/sbox
      - name: Build Android release APK
        run: flutter build apk --release --no-pub
      - name: Upload Android package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safebox-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish rolling latest release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - vulnerability-scan
      - windows
      - linux
      - apple
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: safebox-*
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if ((${#assets[@]} == 0)); then
            echo 'No release assets were downloaded.' >&2
            exit 1
          fi

          release_notes="Automatically updated from main commit $GITHUB_SHA."
          tag_ref="repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "$tag_ref" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            mapfile -t old_assets < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for old_asset in "${old_assets[@]}"; do
              gh release delete-asset "$RELEASE_TAG" "$old_asset" --repo "$GITHUB_REPOSITORY" --yes
            done
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'SafeBox latest (main)' \
              --notes "$release_notes" \
              --latest
          else
            if gh api "$tag_ref" >/dev/null 2>&1; then
              gh api --method PATCH "$tag_ref" -f sha="$GITHUB_SHA" -F force=true >/dev/null
              gh release create "$RELEASE_TAG" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --title 'SafeBox latest (main)' \
                --notes "$release_notes" \
                --verify-tag \
                --latest
            else
              gh release create "$RELEASE_TAG" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title 'SafeBox latest (main)' \
                --notes "$release_notes" \
                --latest
            fi
          fi
