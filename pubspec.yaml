name: safebox
description: Cross-platform SBOX 3.1 encrypted Bundle client with public Metadata previews.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  asn1lib: 1.6.5
  bip39: 1.0.6
  convert: 3.1.2
  crypto: 3.0.7
  cupertino_icons: 1.0.8
  cryptography: 2.9.0
  desktop_drop: 0.7.1
  file_selector: 1.1.0
  flutter_secure_storage: 11.0.0
  http: 1.6.0
  image: 4.5.4
  path: 1.9.1
  shared_preferences: 2.5.5
  unorm_dart: 0.3.2
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  test: 1.31.1

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Variable.ttf
